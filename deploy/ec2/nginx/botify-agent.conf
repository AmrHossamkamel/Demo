server {
    listen 443 ssl http2;
    server_name botify.example.com;

    ssl_certificate /etc/letsencrypt/live/botify.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/botify.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Replace with the organization's trusted office/VPN networks.
    allow 192.0.2.0/24;
    allow 198.51.100.0/24;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name botify.example.com;
    return 301 https://$host$request_uri;
}

